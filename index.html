<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<title>Voetbal Statistieken – Eden</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8;color:#111827}
header{background:#0b1220;color:white;padding:24px 18px 20px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#cbd5e1}
main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}textarea{min-height:70px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#0b1220;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:#64748b}
.row{display:flex;gap:8px}.row>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.match{border-top:1px solid #e5e7eb;padding:14px 0}.match:first-child{border-top:0}.match h3{margin:0 0 5px}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:5px}
.hidden{display:none}.empty{text-align:center;color:#64748b;padding:15px}
</style>
</head>
<body>
<header><h1>⚽ Voetbal Statistieken</h1><p>Eden • persoonlijke voetbalstatistieken</p></header>
<main>
<div class="card">
<label>Seizoen</label>
<div class="row"><select id="season"></select><button class="secondary" onclick="addSeason()">+ Seizoen</button></div>
</div>

<div class="card">
<div class="stats">
<div class="stat"><b id="games">0</b><span>Wedstrijden</span></div>
<div class="stat"><b id="goals">0</b><span>Doelpunten</span></div>
<div class="stat"><b id="assists">0</b><span>Assists</span></div>
</div>
</div>

<div class="card">
<h2 id="formTitle" style="margin-top:0">Wedstrijd toevoegen</h2>
<input type="hidden" id="editId">
<label>Datum</label><input type="date" id="date">
<label>Tegenstander</label><input id="opponent" placeholder="Bijv. FC Emmen">
<div class="row">
<div><label>Wedstrijd gespeeld?</label><select id="played"><option value="yes">Ja</option><option value="no">Nee</option></select></div>
<div><label>Minuten</label><input type="number" id="minutes" min="0" value="0"></div>
</div>
<div class="row">
<div><label>Doelpunten</label><input type="number" id="goalsIn" min="0" value="0"></div>
<div><label>Assists</label><input type="number" id="assistsIn" min="0" value="0"></div>
</div>
<label>Notitie</label><textarea id="note" placeholder="Bijzonderheden..."></textarea>
<div class="actions"><button class="primary" onclick="saveMatch()">Opslaan</button><button class="secondary" onclick="resetForm()">Wissen</button></div>
</div>

<div class="card">
<h2 style="margin-top:0">Wedstrijden</h2><div id="matches"></div>
</div>
</main>
<script>
const KEY="eden_voetbal_statistieken_v3";
let data=JSON.parse(localStorage.getItem(KEY)||'{"2023/2024":[]}');
let seasonEl=document.getElementById("season");
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function current(){return data[seasonEl.value]||[]}
function render(){
 seasonEl.innerHTML=Object.keys(data).map(s=>`<option>${s}</option>`).join("");
 if(!seasonEl.value && Object.keys(data).length) seasonEl.value=Object.keys(data)[0];
 const ms=current(), played=ms.filter(x=>x.played==="yes");
 document.getElementById("games").textContent=played.length;
 document.getElementById("goals").textContent=played.reduce((a,x)=>a+x.goals,0);
 document.getElementById("assists").textContent=played.reduce((a,x)=>a+x.assists,0);
 document.getElementById("matches").innerHTML=ms.length?ms.slice().reverse().map(x=>`
 <div class="match"><h3>${x.opponent||"Zonder tegenstander"}</h3>
 <div class="muted">${x.date||"Geen datum"} ${x.played==="no"?"• niet gespeeld":""}</div>
 <div style="margin-top:8px"><span class="pill">⚽ ${x.goals} doelpunten</span><span class="pill">🎯 ${x.assists} assists</span><span class="pill">⏱️ ${x.minutes} min</span></div>
 ${x.note?`<p>${escapeHtml(x.note)}</p>`:""}
 <div class="actions"><button class="secondary" onclick="editMatch('${x.id}')">Bewerken</button><button class="danger" onclick="deleteMatch('${x.id}')">Verwijderen</button></div></div>`).join(""):'<div class="empty">Nog geen wedstrijden ingevoerd.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function addSeason(){let s=prompt("Naam van het nieuwe seizoen, bijvoorbeeld 2024/2025:");if(s&&s.trim()){if(!data[s.trim()])data[s.trim()]=[];seasonEl.value=s.trim();save()}}
function saveMatch(){
 const id=document.getElementById("editId").value||Date.now().toString();
 const x={id,date:date.value,opponent:opponent.value.trim(),played:played.value,minutes:+minutes.value||0,goals:+goalsIn.value||0,assists:+assistsIn.value||0,note:note.value.trim()};
 if(!data[seasonEl.value])data[seasonEl.value]=[];
 const i=data[seasonEl.value].findIndex(m=>m.id===id);
 if(i>=0)data[seasonEl.value][i]=x;else data[seasonEl.value].push(x);
 resetForm();save();
}
function editMatch(id){const x=current().find(m=>m.id===id);if(!x)return;editId.value=x.id;date.value=x.date;opponent.value=x.opponent;played.value=x.played;minutes.value=x.minutes;goalsIn.value=x.goals;assistsIn.value=x.assists;note.value=x.note;formTitle.textContent="Wedstrijd bewerken";scrollTo({top:0,behavior:"smooth"})}
function deleteMatch(id){if(confirm("Deze wedstrijd verwijderen?")){data[seasonEl.value]=current().filter(x=>x.id!==id);save()}}
function resetForm(){editId.value="";date.value="";opponent.value="";played.value="yes";minutes.value=0;goalsIn.value=0;assistsIn.value=0;note.value="";formTitle.textContent="Wedstrijd toevoegen"}
seasonEl.addEventListener("change",render);render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
